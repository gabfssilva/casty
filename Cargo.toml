[workspace]
members = ["crates/casty-core", "crates/casty-net", "crates/casty-node", "crates/casty-py"]
resolver = "3"

[workspace.package]
version = "0.30.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Documentation policy for published crates; these are not published, and the types say what the errors are.
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
