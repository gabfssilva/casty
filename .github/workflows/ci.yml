name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          # No uv command runs here, so the cache directory is never made, and saving it fails the job whenever no
          # cache was restored for the hash of uv.lock.
          enable-cache: false
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets
      - run: cargo test --all-targets

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14", "3.14t"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check src tests benchmarks examples docs
      - run: uv run ruff format --check src tests benchmarks examples docs
      - run: uv run pyright
      # A test still running after two minutes prints the stack of every thread, and `-v` names each test before it
      # runs: what a hung job leaves behind.
      - run: uv run pytest -v -o faulthandler_timeout=120
