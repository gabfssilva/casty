name: docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The reference is read from the sources and `__init__.pyi`, never imported, so nothing is compiled here.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --only-dev
      # A docstring griffe cannot parse is a warning, and strict mode fails the build on any warning.
      - run: uv run --no-sync mkdocs build --strict
      - run: uv run --no-sync python docs/check_reference.py
