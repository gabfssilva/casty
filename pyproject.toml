[project]
name = "casty"
version = "0.30.0"
description = "Typed, replicated virtual actors for Python"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabriel Francisco" }]
keywords = ["actor", "actor-model", "virtual-actors", "asyncio", "concurrency", "cluster", "distributed"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Framework :: AsyncIO",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/gabfssilva/casty"

[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/casty-py/Cargo.toml"
python-source = "src"
module-name = "casty._casty"
features = ["pyo3/extension-module"]

[dependency-groups]
dev = [
    "griffelib>=2.3.0",
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-describe>=3.2.0",
    "ruff>=0.16.6",
]

[tool.pyright]
include = ["src", "tests"]
# `tests/typing` is what `test_typing` runs pyright against, one file at a time.
exclude = ["tests/typing"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
# pytest-describe collects the nested test functions from locals, which pyright sees as never accessed.
executionEnvironments = [
    { root = "src" },
    { root = ".", reportUnusedFunction = false },
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
describe_prefixes = ["describe", "when"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
