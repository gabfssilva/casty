[project]
name = "casty"
version = "0.30.1"
description = "A minimalist, type-safe actor framework for Python 3.12+ with built-in distributed clustering."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabriel Francisco" }]
keywords = ["actor", "actor-model", "virtual-actors", "asyncio", "concurrency", "cluster", "distributed"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "Framework :: AsyncIO",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/gabfssilva/casty"

[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/casty-py/Cargo.toml"
python-source = "src"
module-name = "casty._casty"
features = ["pyo3/extension-module"]

[dependency-groups]
dev = [
    "griffelib>=2.3.0",
    "lightkube>=1.0.1",
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "pyrefly>=1.3.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-describe>=3.2.0",
    "ruff>=0.16.6",
]

[tool.pyrefly]
project-includes = ["src", "tests", "reliability"]
# `tests/typing` is what `test_typing` runs pyrefly against, one file at a time. `reliability/infra` is a project of
# its own, with its own environment.
project-excludes = ["tests/typing", "reliability/infra"]
preset = "strict"
python-version = "3.12"
# The tests import their helpers from the root, as `tests.cluster`, `tests.app`, ...
search-path = ["."]

[tool.pyrefly.errors]
redundant-cast = "error"
unknown-argument-type = "error"

[tool.pytest.ini_options]
asyncio_mode = "auto"
describe_prefixes = ["describe", "when"]
testpaths = ["tests", "reliability"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
