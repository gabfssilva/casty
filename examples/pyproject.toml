[project]
name = "casty-examples"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["casty"]

# The project installs `local_cluster.py` in development mode, which puts this directory on the path of every example.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["local_cluster.py"]

[tool.uv.sources]
casty = { path = "..", editable = true }
