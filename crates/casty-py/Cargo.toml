[package]
name = "casty-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "_casty"
crate-type = ["cdylib"]

[dependencies]
blake2 = { version = "0.10", default-features = false }
casty-core = { path = "../casty-core" }
casty-net = { path = "../casty-net" }
casty-node = { path = "../casty-node" }
pyo3 = { version = "0.29", features = ["abi3-py313"] }
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
