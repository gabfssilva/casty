site_name: casty
site_description: A minimalist, type-safe actor framework for Python 3.12+ with built-in distributed clustering.
site_url: https://gabfssilva.github.io/casty/
repo_url: https://github.com/gabfssilva/casty
repo_name: gabfssilva/casty
docs_dir: docs/reference
strict: true
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  features:
    - content.code.copy
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode

nav:
  - Overview: index.md
  - casty: casty.md
  - casty.collections: collections.md
  - casty.observer: observer.md
  - casty.stores: stores.md

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            # The extension module is compiled: everything is read from the sources and `__init__.pyi`, never imported.
            allow_inspection: false
            extensions:
              - docs/griffe_overloads.py
            docstring_style: numpy
            docstring_section_style: list
            filters: ["!^_[^_]", "!^__post_init__$"]
            members_order: source
            merge_init_into_class: true
            overloads_only: true
            separate_signature: true
            show_if_no_docstring: true
            show_root_full_path: false
            show_root_heading: true
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
            heading_level: 3
