site_name: casty
site_description: A typed virtual actor framework for concurrent and distributed programming in Python.
site_url: https://gabfssilva.github.io/casty/
repo_url: https://github.com/gabfssilva/casty
repo_name: gabfssilva/casty
docs_dir: docs
exclude_docs: |
  /check_reference.py
  /griffe_overloads.py
  /__pycache__/
strict: true
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  features:
    - content.code.copy
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode

nav:
  - Overview: index.md
  - Introduction: 01-intro.md
  - The actor model: 02-model-actor.md
  - State: 03-state.md
  - Clustering: 04-clustering.md
  - Replication: 05-replication.md
  - Handoff: 06-handoff.md
  - Messaging: 07-messaging.md
  - Schedules: 08-schedulers.md
  - Collections: 09-collections.md
  - Failures and guarantees: 10-failures.md
  - Development: 11-development.md
  - API reference:
      - casty: casty.md
      - casty.collections: collections.md
      - casty.observer: observer.md
      - casty.stores: stores.md

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            # The extension module is compiled: everything is read from the sources and `__init__.pyi`, never imported.
            allow_inspection: false
            extensions:
              - docs/griffe_overloads.py
            docstring_style: numpy
            docstring_section_style: list
            filters: ["!^_[^_]", "!^__post_init__$"]
            members_order: source
            merge_init_into_class: true
            overloads_only: true
            separate_signature: true
            show_if_no_docstring: true
            show_root_full_path: false
            show_root_heading: true
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
            heading_level: 3
